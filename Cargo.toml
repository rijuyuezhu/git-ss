[package]
name = "git-ss"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Git plugin for uploading and downloading temporary snapshot branches."

[[bin]]
name = "git-ss"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
gix = { version = "0.84", default-features = false, features = ["sha1"] }
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
