[package]
name = "git-ss"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Git plugin for uploading and downloading temporary snapshot branches."

[[bin]]
name = "git-ss"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
gix = { version = "0.84.0", default-features = false, features = ["sha1"] }
thiserror = "2.0.18"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
