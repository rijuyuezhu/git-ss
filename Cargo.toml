[package]
name = "git-ss"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "A Git plugin for sharing temporary snapshot branches."
repository = "https://github.com/rijuyuezhu/git-ss"
readme = "README.md"
keywords = ["git", "snapshot", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-ss"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7.2.2"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2", "ssh", "https", "vendored-openssl"] }
thiserror = "2.0.18"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
