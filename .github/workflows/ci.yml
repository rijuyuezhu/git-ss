name: CI

on:
  push:
    branches: [main]
    tags:
      - v*.*.*
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets --all-features

  musl-release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config perl make
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, musl-release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install musl build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config perl make
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build static release binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package binary
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/git-ss dist/git-ss-x86_64-unknown-linux-musl
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/git-ss-x86_64-unknown-linux-musl
          generate_release_notes: true
