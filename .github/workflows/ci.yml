name: CI

on:
  push:
    branches: [main]
    tags:
      - v*.*.*
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets --all-features

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --document-private-items

  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config perl make
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build static release binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Set package metadata
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            package_version="${GITHUB_REF_NAME#v}"
          else
            package_version="$(cargo pkgid | cut -d# -f2)"
          fi
          {
            echo "PACKAGE_VERSION=${package_version}"
            echo "PACKAGE_RELEASE=1"
          } >> "$GITHUB_ENV"
      - name: Package Linux installers
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/git-ss dist/git-ss-x86_64-unknown-linux-musl
          nfpm package --config nfpm.yaml --packager deb --target dist/
          nfpm package --config nfpm.yaml --packager rpm --target dist/
          nfpm package --config nfpm.yaml --packager archlinux --target dist/
      - name: Test deb package in Debian
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:stable-slim bash -lc '
            apt-get update
            apt-get install -y /dist/*.deb
            git-ss --version
            git-ss --help
            git ss -h
          '
      - name: Test rpm package in Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest bash -lc '
            dnf install -y /dist/*.rpm
            git-ss --version
            git-ss --help
            git ss -h
          '
      - name: Test Arch package in Arch Linux
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" archlinux:latest bash -lc '
            pacman -Syu --noconfirm --needed git
            pacman -U --noconfirm /dist/*.pkg.tar.zst
            git-ss --version
            git-ss --help
            git ss -h
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-artifacts
          path: |
            dist/git-ss-x86_64-unknown-linux-musl
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, docs, linux-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-artifacts
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/git-ss-x86_64-unknown-linux-musl
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          generate_release_notes: true

  aur:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'rijuyuezhu/git-ss'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-artifacts
          path: dist
      - name: Generate AUR PKGBUILD
        run: |
          package_version="${GITHUB_REF_NAME#v}"
          binary_sha256="$(sha256sum dist/git-ss-x86_64-unknown-linux-musl | cut -d ' ' -f 1)"
          license_sha256="$(sha256sum LICENSE | cut -d ' ' -f 1)"
          mkdir -p dist/aur
          while IFS= read -r line; do
            line="${line//@PKGVER@/${package_version}}"
            line="${line//@BINARY_SHA256@/${binary_sha256}}"
            line="${line//@LICENSE_SHA256@/${license_sha256}}"
            printf '%s\n' "$line"
          done < packaging/aur/PKGBUILD.template > dist/aur/PKGBUILD
      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: git-ss-bin
          pkgbuild: dist/aur/PKGBUILD
          test: true
          test_flags: --clean --cleanbuild --nodeps --noconfirm
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update git-ss-bin to ${{ github.ref_name }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
