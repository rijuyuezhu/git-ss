name: CI

on:
  push:
    branches: [main]
    tags:
      - v*.*.*
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets --all-features

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --document-private-items

  linux-release:
    name: linux release (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            nfpm_arch: amd64
            archlinux_image: archlinux:latest
            packages: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            nfpm_arch: arm64
            archlinux_image: menci/archlinuxarm:base
            packages: true
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            packages: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            packages: false
    steps:
      - uses: actions/checkout@v4
      - name: Install musl build tooling
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config perl make
      - uses: actions/setup-go@v5
        if: matrix.packages
        with:
          go-version: stable
      - name: Install nFPM
        if: matrix.packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Test release binary
        run: |
          binary="target/${{ matrix.target }}/release/git-ss"
          "$binary" --version
          "$binary" --help
          mkdir -p smoke-bin
          cp "$binary" smoke-bin/git-ss
          PATH="$PWD/smoke-bin:$PATH" git ss -h
      - name: Package release archive
        run: |
          binary="target/${{ matrix.target }}/release/git-ss"
          package_dir="archive/git-ss-${{ matrix.target }}"
          mkdir -p dist "$package_dir"
          cp "$binary" "dist/git-ss-${{ matrix.target }}"
          cp "$binary" "$package_dir/git-ss"
          cp LICENSE README.md "$package_dir/"
          tar -czf "dist/git-ss-${{ matrix.target }}.tar.gz" -C archive "git-ss-${{ matrix.target }}"
      - name: Test install script
        if: contains(matrix.target, 'musl')
        run: |
          (cd dist && sha256sum "git-ss-${{ matrix.target }}" > SHA256SUMS)
          GIT_SS_BASE_URL="file://$PWD/dist" GIT_SS_INSTALL_DIR="$PWD/install-test/bin" sh ./install.sh
          install-test/bin/git-ss --version
          install-test/bin/git-ss --help
          rm dist/SHA256SUMS
      - name: Set package metadata
        if: matrix.packages
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            package_version="${GITHUB_REF_NAME#v}"
          else
            package_version="$(cargo pkgid | cut -d# -f2)"
          fi
          {
            echo "PACKAGE_VERSION=${package_version}"
            echo "PACKAGE_RELEASE=1"
          } >> "$GITHUB_ENV"
      - name: Package Linux installers
        if: matrix.packages
        env:
          PACKAGE_ARCH: ${{ matrix.nfpm_arch }}
          PACKAGE_BINARY: target/${{ matrix.target }}/release/git-ss
        run: |
          nfpm package --config nfpm.yaml --packager deb --target dist/
          nfpm package --config nfpm.yaml --packager rpm --target dist/
          nfpm package --config nfpm.yaml --packager archlinux --target dist/
      - name: Test deb package in Debian
        if: matrix.packages
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:stable-slim bash -lc '
            apt-get update
            apt-get install -y /dist/*.deb
            git-ss --version
            git-ss --help
            git ss -h
          '
      - name: Test rpm package in Fedora
        if: matrix.packages
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest bash -lc '
            dnf install -y /dist/*.rpm
            git-ss --version
            git-ss --help
            git ss -h
          '
      - name: Test Arch package in Arch Linux
        if: matrix.packages
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" "${{ matrix.archlinux_image }}" bash -lc '
            pacman -Syu --noconfirm --needed git
            pacman -U --noconfirm /dist/*.pkg.tar.zst
            git-ss --version
            git-ss --help
            git ss -h
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}-release-artifacts
          path: dist/*

  macos-release:
    name: macOS release (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            uname: x86_64
          - target: aarch64-apple-darwin
            runner: macos-15
            uname: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.uname }}"
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Test release binary
        run: |
          binary="target/${{ matrix.target }}/release/git-ss"
          "$binary" --version
          "$binary" --help
          mkdir -p smoke-bin
          cp "$binary" smoke-bin/git-ss
          PATH="$PWD/smoke-bin:$PATH" git ss -h
      - name: Package release archive
        run: |
          binary="target/${{ matrix.target }}/release/git-ss"
          package_dir="archive/git-ss-${{ matrix.target }}"
          mkdir -p dist "$package_dir"
          cp "$binary" "dist/git-ss-${{ matrix.target }}"
          cp "$binary" "$package_dir/git-ss"
          cp LICENSE README.md "$package_dir/"
          tar -czf "dist/git-ss-${{ matrix.target }}.tar.gz" -C archive "git-ss-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}-release-artifacts
          path: dist/*

  windows-release:
    name: Windows release (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target $env:TARGET
        env:
          TARGET: ${{ matrix.target }}
      - name: Test release binary
        run: |
          $binary = "target\$env:TARGET\release\git-ss.exe"
          & $binary --version
          & $binary --help
          $releaseDir = Resolve-Path "target\$env:TARGET\release"
          $env:PATH = "$releaseDir;$env:PATH"
          git ss -h
        env:
          TARGET: ${{ matrix.target }}
      - name: Package release archive
        run: |
          $binary = "target\$env:TARGET\release\git-ss.exe"
          $packageDir = "archive\git-ss-$env:TARGET"
          New-Item -ItemType Directory -Force -Path dist, $packageDir
          Copy-Item $binary "dist\git-ss-$env:TARGET.exe"
          Copy-Item $binary "$packageDir\git-ss.exe"
          Copy-Item LICENSE, README.md $packageDir
          Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\git-ss-$env:TARGET.zip" -Force
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}-release-artifacts
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, docs, linux-release, macos-release, windows-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release-artifacts'
          path: dist
          merge-multiple: true
      - name: Include installer script
        run: cp install.sh dist/install.sh
      - name: Generate checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  aur:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'rijuyuezhu/git-ss'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-unknown-linux-musl-release-artifacts
          path: dist
      - name: Generate AUR PKGBUILD
        run: |
          package_version="${GITHUB_REF_NAME#v}"
          binary_sha256="$(sha256sum dist/git-ss-x86_64-unknown-linux-musl | cut -d ' ' -f 1)"
          license_sha256="$(sha256sum LICENSE | cut -d ' ' -f 1)"
          mkdir -p dist/aur
          while IFS= read -r line; do
            line="${line//@PKGVER@/${package_version}}"
            line="${line//@BINARY_SHA256@/${binary_sha256}}"
            line="${line//@LICENSE_SHA256@/${license_sha256}}"
            printf '%s\n' "$line"
          done < packaging/aur/PKGBUILD.template > dist/aur/PKGBUILD
      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: git-ss-bin
          pkgbuild: dist/aur/PKGBUILD
          test: true
          test_flags: --clean --cleanbuild --nodeps --noconfirm
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update git-ss-bin to ${{ github.ref_name }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
