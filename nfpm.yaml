# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
name: git-ss
arch: amd64
platform: linux
version: ${PACKAGE_VERSION}
version_schema: semver
release: ${PACKAGE_RELEASE}
section: vcs
priority: optional
maintainer: Rijuyuezhu <rijuyuezhu@users.noreply.github.com>
description: A Git plugin for sharing temporary snapshot branches.
vendor: rijuyuezhu
homepage: https://github.com/rijuyuezhu/git-ss
license: MIT
depends:
  - git
contents:
  - src: target/x86_64-unknown-linux-musl/release/git-ss
    dst: /usr/bin/git-ss
    file_info:
      mode: 0755
